name: Unpack project
on:
  push:
    paths:
      - 'asai-github.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          if [ -f asai-github.zip ]; then
            unzip -o asai-github.zip
            rm asai-github.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unpack project" || echo "nothing to commit"
            git push
          fi
